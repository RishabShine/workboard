services:
  db:
    image: postgres:16
    container_name: workboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: workboard
      POSTGRES_USER: workboard
      POSTGRES_PASSWORD: workboard_pw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workboard -d workboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./workboard-api   # <-- adjust to your actual backend folder name
    container_name: workboard-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/workboard
      SPRING_DATASOURCE_USERNAME: workboard
      SPRING_DATASOURCE_PASSWORD: workboard_pw
      SECURITY_JWT_SECRET: ${JWT_SECRET:-MugfaFjn2TZsAM8ngqbHCs8EyNe/Vp8oH1aMOgxZnm4=}
      SECURITY_JWT_EXPMINUTES: 15
      AWS_REGION: ca-central-1
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./workboard-frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: workboard-frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  pgdata: